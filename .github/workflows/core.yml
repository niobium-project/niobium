# Pull requests compile the Linux SDK against a cached engine. Pushes to main and
# manual runs qualify published bytes on Linux, macOS and Windows from source.
# A documentation-only change skips both paths. The pull-request compile is not
# native qualification and must not publish core-sdk-* artifacts.
name: Core qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: core-qualification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: sh .github/ci/changed-paths.sh

  fast:
    name: Linux SDK compile
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
          build-cache: "false"
      - id: engine-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ci-prebuilt
          key: engine-v1-1.96.1-x86_64-unknown-linux-gnu-${{ hashFiles('third_party/wasmtime/adapter/Cargo.lock', 'third_party/wasmtime/adapter/Cargo.toml', 'third_party/wasmtime/adapter/*.rs', 'tests/component/reference/Cargo.toml', 'tests/component/reference/Cargo.lock', 'tests/component/reference/guest.rs', 'tests/component/rust/Cargo.toml', 'tests/component/rust/Cargo.lock', 'tests/component/rust/guest.rs', 'libs/stdlib/files/Cargo.toml', 'libs/stdlib/files/Cargo.lock', 'libs/stdlib/files/guest.rs', 'api/wit/reference/reference.wit', 'api/wit/files/files.wit', 'api/wit/qualification/qualification.wit', 'api/wit/runtime/proposal.wit', 'build/component.zig', 'build/component_cpu.zig', 'build/component_prebuilt.zig', 'build/commands.zig') }}
      - id: engine
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          set -eu
          use=false
          if [ "$CACHE_HIT" = true ]; then
            use=true
            for name in \
              libniobium_wasmtime.a \
              niobium_stdlib_files.wasm \
              niobium_reference_library.wasm \
              niobium_reference_library-revision-two.wasm \
              niobium_component_consumer.wasm
            do
              if [ ! -f "ci-prebuilt/$name" ]; then
                use=false
              fi
            done
          fi
          echo "use=$use" >> "$GITHUB_OUTPUT"
      - name: Compile the Linux SDK with the cached engine
        if: success() && steps.engine.outputs.use == 'true'
        run: |
          set -euo pipefail
          zig build sdk:build --cache-poison=disallowed --summary all \
            -Dprebuilt-engine=ci-prebuilt/libniobium_wasmtime.a \
            -Dprebuilt-guests=ci-prebuilt
      - name: Compile the Linux SDK from source
        if: success() && steps.engine.outputs.use != 'true'
        run: |
          set -euo pipefail
          zig build sdk:build --cache-poison=disallowed --summary all
      - name: Export the engine and wasm32 guests
        if: >-
          success() && steps.engine.outputs.use != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: zig build core:prebuilt-export
      - name: Save the engine and wasm32 guests
        if: >-
          success() && steps.engine.outputs.use != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ci-prebuilt
          key: engine-v1-1.96.1-x86_64-unknown-linux-gnu-${{ hashFiles('third_party/wasmtime/adapter/Cargo.lock', 'third_party/wasmtime/adapter/Cargo.toml', 'third_party/wasmtime/adapter/*.rs', 'tests/component/reference/Cargo.toml', 'tests/component/reference/Cargo.lock', 'tests/component/reference/guest.rs', 'tests/component/rust/Cargo.toml', 'tests/component/rust/Cargo.lock', 'tests/component/rust/guest.rs', 'libs/stdlib/files/Cargo.toml', 'libs/stdlib/files/Cargo.lock', 'libs/stdlib/files/guest.rs', 'api/wit/reference/reference.wit', 'api/wit/files/files.wit', 'api/wit/qualification/qualification.wit', 'api/wit/runtime/proposal.wit', 'build/component.zig', 'build/component_cpu.zig', 'build/component_prebuilt.zig', 'build/commands.zig') }}

  native:
    name: Native ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux
            arch: X64
            rust_targets: x86_64-unknown-linux-gnu wasm32-unknown-unknown
          - runner: macos-15
            target: aarch64-macos
            arch: ARM64
            rust_targets: aarch64-apple-darwin wasm32-unknown-unknown
          - runner: windows-2025
            target: x86_64-windows
            arch: X64
            rust_targets: x86_64-pc-windows-gnu x86_64-pc-windows-msvc wasm32-unknown-unknown
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NIOBIUM_CI_TARGET: ${{ matrix.target }}
      NIOBIUM_CI_ARCH: ${{ matrix.arch }}
      NIOBIUM_RUST_TARGETS: ${{ matrix.rust_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
          build-cache: "false"
      - name: Install pinned Rust and Go
        run: zig build tools:install --summary all
      - name: Resolve Windows GNU prerequisites explicitly
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
          gcc_path=$(cygpath -m "$(command -v gcc)")
          dlltool_path=$(cygpath -m "$(command -v dlltool)")
          test -f "$gcc_path"
          test -f "$dlltool_path"
          python3 -c 'import subprocess; v=subprocess.check_output(["gcc","-dumpfullversion"],text=True); assert tuple(map(int,v.strip().split(".")[:2])) >= (14,2), v'
          echo "CC=$gcc_path" >> "$GITHUB_ENV"
          echo "CC_x86_64_pc_windows_gnu=$gcc_path" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gcc_path" >> "$GITHUB_ENV"
          mkdir -p .evidence/core-ci
          { printf '%s\n' "$gcc_path" "$dlltool_path"; gcc --version; dlltool --version; } \
            > .evidence/core-ci/windows-gnu.txt
      - name: Record source and toolchain provenance before building
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path.cwd()
          evidence = root / '.evidence/core-ci'
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'started.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'target': os.environ['NIOBIUM_CI_TARGET'],
              'stage': 'source and toolchain provenance', 'status': 'NOT_RUN',
          }) + '\n')
          def command(*args):
              return subprocess.check_output(args, text=True, timeout=60).strip()
          assert os.environ['RUNNER_ARCH'] == os.environ['NIOBIUM_CI_ARCH']
          machine = platform.machine().lower()
          expected = {'X64': {'amd64', 'x86_64'}, 'ARM64': {'arm64', 'aarch64'}}
          assert machine in expected[os.environ['NIOBIUM_CI_ARCH']], machine
          assert command('git', 'status', '--porcelain', '--untracked-files=no') == ''
          assert command('git', 'rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          tracked = subprocess.check_output(['git', 'ls-files', '--stage', '-z'])
          source = []
          for entry in sorted(tracked.decode().split('\0')[:-1]):
              metadata, name = entry.split('\t', 1)
              mode, blob, stage = metadata.split()
              assert stage == '0' and mode in {'100644', '100755', '120000'}, entry
              path = root / name
              # Hash the tracked link itself, including Windows text-link checkouts.
              data = os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes()
              source.append({'path': name, 'git_mode': mode, 'git_blob': blob,
                             'sha256': hashlib.sha256(data).hexdigest()})
          report = {
              'schema': 1, 'commit': command('git', 'rev-parse', 'HEAD'),
              'tree': command('git', 'rev-parse', 'HEAD^{tree}'), 'dirty': False,
              'run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                     + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'target': os.environ['NIOBIUM_CI_TARGET'], 'machine': machine,
              'os': platform.platform(), 'runner_image': os.environ.get('ImageVersion'),
              'zig_version': command('zig', 'version'),
              'zig_env_zon': command('zig', 'env'),
              'rustc': command(str(root / '.cache/tools/rust/1.96.1/bin' / ('rustc.exe' if os.name == 'nt' else 'rustc')), '-Vv'),
              'cargo': command(str(root / '.cache/tools/rust/1.96.1/bin' / ('cargo.exe' if os.name == 'nt' else 'cargo')), '-V'),
              'go': command(str(root / '.cache/tools/go/1.26.8/bin' / ('go.exe' if os.name == 'nt' else 'go')), 'version'),
              'c_compiler': command(os.environ.get('CC', 'cc'), '--version'),
              'source_files': source,
          }
          (evidence / 'source.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Run native contracts, author parity, lifecycle and SDK publication
        run: |
          set -euo pipefail
          zig build test:core sdk:build core:cross-tools --cache-poison=disallowed --summary all \
            2>&1 | tee .evidence/core-ci/build.log
      - name: Restore the Linux engine cache marker
        id: engine-cache
        if: success() && matrix.target == 'x86_64-linux'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ci-prebuilt
          key: engine-v1-1.96.1-x86_64-unknown-linux-gnu-${{ hashFiles('third_party/wasmtime/adapter/Cargo.lock', 'third_party/wasmtime/adapter/Cargo.toml', 'third_party/wasmtime/adapter/*.rs', 'tests/component/reference/Cargo.toml', 'tests/component/reference/Cargo.lock', 'tests/component/reference/guest.rs', 'tests/component/rust/Cargo.toml', 'tests/component/rust/Cargo.lock', 'tests/component/rust/guest.rs', 'libs/stdlib/files/Cargo.toml', 'libs/stdlib/files/Cargo.lock', 'libs/stdlib/files/guest.rs', 'api/wit/reference/reference.wit', 'api/wit/files/files.wit', 'api/wit/qualification/qualification.wit', 'api/wit/runtime/proposal.wit', 'build/component.zig', 'build/component_cpu.zig', 'build/component_prebuilt.zig', 'build/commands.zig') }}
      - name: Export the Linux engine and wasm32 guests
        if: success() && matrix.target == 'x86_64-linux'
        run: zig build core:prebuilt-export
      - name: Save the Linux engine and wasm32 guests
        if: >-
          success() && matrix.target == 'x86_64-linux' &&
          steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ci-prebuilt
          key: engine-v1-1.96.1-x86_64-unknown-linux-gnu-${{ hashFiles('third_party/wasmtime/adapter/Cargo.lock', 'third_party/wasmtime/adapter/Cargo.toml', 'third_party/wasmtime/adapter/*.rs', 'tests/component/reference/Cargo.toml', 'tests/component/reference/Cargo.lock', 'tests/component/reference/guest.rs', 'tests/component/rust/Cargo.toml', 'tests/component/rust/Cargo.lock', 'tests/component/rust/guest.rs', 'libs/stdlib/files/Cargo.toml', 'libs/stdlib/files/Cargo.lock', 'libs/stdlib/files/guest.rs', 'api/wit/reference/reference.wit', 'api/wit/files/files.wit', 'api/wit/qualification/qualification.wit', 'api/wit/runtime/proposal.wit', 'build/component.zig', 'build/component_cpu.zig', 'build/component_prebuilt.zig', 'build/commands.zig') }}
      - name: Package the qualified SDK and final executable inventory
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile
          sdk = pathlib.Path('zig-out')
          provenance = sdk / 'share/niobium/provenance'
          provenance.mkdir(parents=True, exist_ok=True)
          shutil.copyfile('.evidence/core-ci/source.json', provenance / 'source.json')
          runtime = sdk / 'bin' / ('niobium-runtime.exe' if os.name == 'nt' else 'niobium-runtime')
          assert runtime.stat().st_size <= 30 * 1024 * 1024, 'Runtime exceeds the 30 MiB gate'
          entries = []
          for path in sorted(sdk.rglob('*')):
              assert not path.is_symlink(), path
              if path.is_file():
                  entries.append({'path': path.relative_to(sdk).as_posix(),
                                  'bytes': path.stat().st_size,
                                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          inventory = {'schema': 1, 'target': os.environ['NIOBIUM_CI_TARGET'],
                       'commit': os.environ['GITHUB_SHA'], 'files': entries}
          (sdk / 'inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
          shutil.copyfile(sdk / 'inventory.json', '.evidence/core-ci/inventory.json')
          out = pathlib.Path('ci-artifacts')
          out.mkdir()
          archive = out / 'sdk.tar.gz'
          with tarfile.open(archive, 'w:gz') as stream:
              stream.add(sdk, arcname='sdk')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out / 'sdk.tar.gz.sha256').write_text(digest + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-sdk-${{ matrix.target }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-evidence-${{ matrix.target }}-${{ github.run_attempt }}
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  assemble:
    name: Linux assembly from published bytes
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No checkout or language-toolchain setup is present in this job.
    defaults:
      run:
        shell: bash
    env:
      ASSEMBLY_IMAGE: ubuntu:24.04@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: core-sdk-*
          path: published
      - name: Verify and extract bounded publisher archives
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path('published')
          evidence = pathlib.Path('.evidence/core-ci-assembly')
          evidence.mkdir(parents=True)
          publishers = []
          for target in ('aarch64-macos', 'x86_64-windows', 'x86_64-linux'):
              directory = root / ('core-sdk-' + target)
              archive = directory / 'sdk.tar.gz'
              assert archive.stat().st_size <= 512 * 1024 * 1024
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert digest == (directory / 'sdk.tar.gz.sha256').read_text().strip()
              with tarfile.open(archive, 'r:gz') as stream:
                  total = 0
                  for index, member in enumerate(stream):
                      path = pathlib.PurePosixPath(member.name)
                      assert index < 4096 and not path.is_absolute() and '..' not in path.parts
                      assert path.parts[0] == 'sdk' and '\\' not in member.name
                      assert member.isdir() or member.isfile(), member.name
                      total += member.size
                      assert member.size <= 256 * 1024 * 1024 and total <= 2 * 1024**3
                      destination = directory.joinpath(*path.parts)
                      if member.isdir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with stream.extractfile(member) as source, destination.open('xb') as output:
                              while chunk := source.read(65536):
                                  output.write(chunk)
                          destination.chmod(member.mode & 0o777)
              sdk = directory / 'sdk'
              inventory = json.loads((sdk / 'inventory.json').read_text())
              assert inventory['commit'] == os.environ['GITHUB_SHA']
              assert inventory['target'] == target
              actual = {p.relative_to(sdk).as_posix() for p in sdk.rglob('*') if p.is_file()}
              assert actual == {i['path'] for i in inventory['files']} | {'inventory.json'}
              for item in inventory['files']:
                  data = (sdk / item['path']).read_bytes()
                  assert len(data) == item['bytes']
                  assert hashlib.sha256(data).hexdigest() == item['sha256']
              publishers.append({'target': target, 'archive_sha256': digest, 'inventory': inventory})
          (evidence / 'publishers.json').write_text(json.dumps(publishers, indent=2) + '\n')
          PY
      - name: Prepare fixed product inputs using the published host SDK
        run: |
          set -euo pipefail
          linux="$PWD/published/core-sdk-x86_64-linux/sdk"
          mac="$PWD/published/core-sdk-aarch64-macos/sdk"
          windows="$PWD/published/core-sdk-x86_64-windows/sdk"
          "$linux/bin/core-cross-prepare" "$PWD/inputs" \
            "$linux/bin/nb-builder" \
            "$mac/bin/niobium-runtime" "$windows/bin/niobium-runtime.exe" \
            "$linux/bin/niobium-runtime" "$linux/bin/nb-component-worker" \
            "$linux/bin/rcodesign" "$linux/lib/niobium/stdlib/files.wasm" \
            "$linux/share/niobium/examples/toolchain-v1.wasm" \
            "$linux/share/niobium/examples/toolchain-v2.wasm" "$linux/bin/core-cross-assemble"
          mkdir outputs
      - name: Assemble without source, network or runtime compiler/linker
        run: |
          set -euo pipefail
          docker pull "$ASSEMBLY_IMAGE"
          docker image inspect "$ASSEMBLY_IMAGE" > .evidence/core-ci-assembly/container.json
          docker run --rm --network none --read-only "$ASSEMBLY_IMAGE" /bin/sh -ec \
            'for tool in zig cc gcc clang rustc cargo go ld; do ! command -v "$tool"; done'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --memory 2g --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$PWD/inputs,target=/inputs,readonly" \
            --mount "type=bind,source=$PWD/outputs,target=/outputs" \
            --workdir /outputs --env PATH=/no-tools --entrypoint /inputs/assemble \
            "$ASSEMBLY_IMAGE" /inputs /outputs 2>&1 | tee .evidence/core-ci-assembly/build.log
      - name: Publish exact setup bytes and their inventory
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('outputs')
          entries = []
          for path in sorted(root.rglob('*')):
              assert not path.is_symlink()
              if path.is_file():
                  entries.append({'path': path.relative_to(root).as_posix(),
                                  'bytes': path.stat().st_size,
                                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          assert len(list(root.rglob('*.setup'))) == 12
          manifest = {'schema': 1, 'commit': os.environ['GITHUB_SHA'],
                      'assembly_image': os.environ['ASSEMBLY_IMAGE'], 'files': entries}
          (root / 'inventory.json').write_text(json.dumps(manifest, indent=2) + '\n')
          shutil.copyfile(root / 'inventory.json', '.evidence/core-ci-assembly/inventory.json')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-delivered-images
          path: outputs/
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-assembly-evidence-${{ github.run_attempt }}
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  delivered:
    name: Delivered bytes on ${{ matrix.target }}
    needs: [native, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux
            arch: X64
          - runner: macos-15
            target: aarch64-macos
            arch: ARM64
          - runner: windows-2025
            target: x86_64-windows
            arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NIOBIUM_CI_TARGET: ${{ matrix.target }}
      NIOBIUM_CI_ARCH: ${{ matrix.arch }}
    # The target consumes the transferred images; it never rebuilds or signs them.
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: core-sdk-${{ matrix.target }}
          path: publisher
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: core-delivered-images
          path: images
      - name: Verify identities and run the published native witness
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, tarfile
          evidence = pathlib.Path('.evidence/core-ci-delivered')
          evidence.mkdir(parents=True)
          assert os.environ['RUNNER_ARCH'] == os.environ['NIOBIUM_CI_ARCH']
          expected = {'X64': {'amd64', 'x86_64'}, 'ARM64': {'arm64', 'aarch64'}}
          assert platform.machine().lower() in expected[os.environ['NIOBIUM_CI_ARCH']]
          archive = pathlib.Path('publisher/sdk.tar.gz')
          assert archive.stat().st_size <= 512 * 1024 * 1024
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive_hash == pathlib.Path('publisher/sdk.tar.gz.sha256').read_text().strip()
          executable = 'core-delivered-native' + ('.exe' if os.name == 'nt' else '')
          with tarfile.open(archive, 'r:gz') as stream:
              members = {}
              total = 0
              for index, member in enumerate(stream):
                  path = pathlib.PurePosixPath(member.name)
                  assert index < 4096 and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] == 'sdk' and '\\' not in member.name
                  assert member.isdir() or member.isfile(), member.name
                  assert member.name not in members, member.name
                  total += member.size
                  assert member.size <= 256 * 1024 * 1024 and total <= 2 * 1024**3
                  members[member.name] = member
              inventory_member = members['sdk/inventory.json']
              assert inventory_member.isfile() and inventory_member.size <= 1024 * 1024
              inventory = json.load(stream.extractfile(inventory_member))
              assert inventory['commit'] == os.environ['GITHUB_SHA']
              assert inventory['target'] == os.environ['NIOBIUM_CI_TARGET']
              member = members['sdk/bin/' + executable]
              assert member.isfile() and member.size <= 30 * 1024 * 1024
              data = stream.extractfile(member).read()
          recorded = next(i for i in inventory['files'] if i['path'] == 'bin/' + executable)
          witness_hash = hashlib.sha256(data).hexdigest()
          assert len(data) == recorded['bytes'] and witness_hash == recorded['sha256']
          witness = pathlib.Path(executable)
          witness.write_bytes(data)
          witness.chmod(0o755)
          images = pathlib.Path('images')
          manifest = json.loads((images / 'inventory.json').read_text())
          assert manifest['commit'] == os.environ['GITHUB_SHA']
          actual = {p.relative_to(images).as_posix() for p in images.rglob('*') if p.is_file()}
          assert actual == {i['path'] for i in manifest['files']} | {'inventory.json'}
          def verify():
              for item in manifest['files']:
                  path = images / item['path']
                  assert not path.is_symlink()
                  data = path.read_bytes()
                  assert len(data) == item['bytes']
                  assert hashlib.sha256(data).hexdigest() == item['sha256']
          verify()
          target = images / os.environ['NIOBIUM_CI_TARGET']
          for path in target.glob('*.setup'):
              path.chmod(0o755)
          report = {'schema': 1, 'commit': os.environ['GITHUB_SHA'],
                    'target': os.environ['NIOBIUM_CI_TARGET'], 'machine': platform.machine(),
                    'os': platform.platform(), 'archive_sha256': archive_hash,
                    'witness_sha256': witness_hash, 'assembly': manifest, 'status': 'FAIL'}
          record = evidence / 'identities.json'
          record.write_text(json.dumps(report, indent=2) + '\n')
          result = subprocess.run([str(witness.resolve()), str(target.resolve())], timeout=600)
          report['exit_code'] = result.returncode
          verify()
          report['status'] = 'PASS' if result.returncode == 0 else 'FAIL'
          record.write_text(json.dumps(report, indent=2) + '\n')
          assert result.returncode == 0, result.returncode
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-delivered-evidence-${{ matrix.target }}-${{ github.run_attempt }}
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  required:
    name: Core v2 required
    if: always()
    needs: [changes, fast, native, assemble, delivered]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected gate
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          EVENT: ${{ github.event_name }}
          FAST: ${{ needs.fast.result }}
          NATIVE: ${{ needs.native.result }}
          ASSEMBLE: ${{ needs.assemble.result }}
          DELIVERED: ${{ needs.delivered.result }}
        run: |
          set -eu
          test "$CHANGES" = success
          if [ "$CODE" = true ] && [ "$EVENT" = pull_request ]; then
            test "$FAST" = success
            test "$NATIVE" = skipped
            test "$ASSEMBLE" = skipped
            test "$DELIVERED" = skipped
          elif [ "$CODE" = true ]; then
            test "$FAST" = skipped
            test "$NATIVE" = success
            test "$ASSEMBLE" = success
            test "$DELIVERED" = success
          else
            test "$FAST" = skipped
            test "$NATIVE" = skipped
            test "$ASSEMBLE" = skipped
            test "$DELIVERED" = skipped
          fi
